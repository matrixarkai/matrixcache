name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install RocksDB build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test (default / RocksDB SSD backend)
        run: cargo test --locked

      - name: Test (no default features / compatibility store)
        run: cargo test --locked --no-default-features

      - name: Grafana dashboard validation
        run: tools/validate_grafana_dashboard.py

      - name: Soak report smoke
        run: |
          cargo run --locked --no-default-features --example soak -- 1 1 \
            --duration-seconds 2 \
            --sample-seconds 1 \
            --json-output /tmp/matrixcache-soak.json \
            --require-passed \
            --max-get-p99-us 1000000 \
            --max-put-p99-us 1000000 \
            --max-read-through-p99-us 1000000 \
            --min-hit-rate-percent 1
          tools/validate_soak_report.py /tmp/matrixcache-soak.json \
            --max-get-p99-us 1000000 \
            --max-put-p99-us 1000000 \
            --max-read-through-p99-us 1000000 \
            --min-hit-rate-percent 1 \
            --min-reads 1000 \
            --min-writes 100 \
            --min-memory-evictions 1 \
            --min-get-samples 1000 \
            --min-put-samples 100 \
            --min-read-through-samples 1000 \
            --min-eviction-samples 1
          tools/compare_soak_reports.py /tmp/matrixcache-soak.json /tmp/matrixcache-soak.json

      - name: Cluster routing smoke
        # Three ceilings, each chosen against a cost that was measured, fixed,
        # and would otherwise regress in silence. A shared runner cannot resolve
        # tens of nanoseconds and a gate that tries becomes a gate people rerun
        # until it passes, so each one sits well above what the change achieved
        # and well below what it replaced.
        #
        #   owner-ns      lookups are ~112ns at 512 nodes. 20000 is a
        #                 catastrophe check only: the cost this replaced was
        #                 273ns, which no shared runner could tell apart.
        #   copies-ns     placing copies with no domain to spread into was
        #                 12304ns and is 1622ns. 8000 catches a return to
        #                 comparing node names by string and still allows the
        #                 runner to be five times slower than this measurement.
        #   mark-down-ms  marking one node down was 5.98ms at this size and is
        #                 0.02ms. 2 catches a ring rebuilt for a state change
        #                 with a hundredfold allowance.
        #   plan-ms       planning a move is 1.8ms, against 5.4ms when it sorted
        #                 the two rings' boundaries rather than merging them.
        #                 That is three times, and so is the spread between this
        #                 machine and a shared runner, so 25 is a catastrophe
        #                 check like the lookup above -- not a claim to catch the
        #                 sort coming back.
        run: |
          cargo run --locked --release --no-default-features --example cluster_routing_cost -- 512 \
            --json-output /tmp/matrixcache-routing.json \
            --max-owner-ns 20000 \
            --max-copies-ns 8000 \
            --max-mark-down-ms 2 \
            --max-plan-ms 25 \
            --require-passed
          python3 -c "
          import json, sys
          report = json.load(open('/tmp/matrixcache-routing.json'))
          assert report['passed'], report
          rows = report['placement']
          assert len(rows) == 4, rows
          # A ring is built for every node, so the point count has to grow with
          # the cluster; a ring that stopped growing would place everything on
          # one node and still answer quickly.
          points = [row['ring_points'] for row in rows]
          assert points == sorted(points) and points[0] < points[-1], points
          # Balance is deterministic, so this one is safe to hold to a number.
          worst = max(row['peak_over_mean'] for row in report['points_per_node'])
          assert worst < 4.0, report['points_per_node']
          # A state change must not rebuild the ring, which shows as the point
          # count being the same before and after a node goes down. The bench
          # reports the count per node step, so check it grew only with nodes.
          assert report['mark_down_ms'] < 2.0, report['mark_down_ms']
          assert report['worst_copies_ns'] < 8000, report['worst_copies_ns']
          assert report['plan_one_ms'] < 25.0, report['plan_one_ms']
          # A plan that moved nothing would pass every ceiling above and be
          # useless, so insist it found work to do.
          assert report['plan_handoffs'] > 0, report
          print('routing report ok:', report['worst_owner_ns'], 'ns worst lookup,',
                report['worst_copies_ns'], 'ns worst copies,',
                report['mark_down_ms'], 'ms mark-down')
          "

      - name: Shard count smoke
        # Two findings, and deliberately no timing ceiling.
        #
        # A shard count is not configured anywhere in this repository, so the
        # cost of choosing one is only ever visible in this sweep. Both things
        # held here are ratios or counts rather than absolute times, because the
        # absolute times move by 30% between a loaded box and an idle one while
        # these do not.
        #
        #   writers need the locks   four writers against one shard measured
        #                            7.5x the cost at sixteen on a loaded box and
        #                            9.7x on an idle one. The gate asks for 2x
        #                            and for the bands not to overlap, which is
        #                            about four times the headroom that spread
        #                            needs. It catches the one regression that
        #                            matters: a change that puts the shards back
        #                            behind a single lock.
        #
        #   both eviction regimes    evictions per write came out identical to
        #                            three decimals on both boxes, so this one is
        #                            not a timing at all. A count that evicts on
        #                            almost nothing and a count that evicts on
        #                            almost every write must both still be in the
        #                            sweep -- otherwise the write column has
        #                            stopped covering the behaviour it describes,
        #                            and the gate above would be passing on a
        #                            workload that no longer provokes it. Driven:
        #                            dropping the read count to 20,000 removes the
        #                            evicting regime and this fails, as it should.
        #
        # Read cost is reported and not required: it separates at 1.4x, which is
        # inside a shared runner's own spread, and a gate on it would be one
        # people rerun until it passes.
        #
        # Capped at 256 shards. A thousand shards adds half the runtime and the
        # two findings are already covered by 1 against 16 and by 16 against 256.
        run: |
          cargo run --locked --release --no-default-features --example shard_count_bench -- \
            --shards-max 256 \
            --json-output /tmp/matrixcache-shards.json \
            --require-passed
          python3 -c "
          import json
          report = json.load(open('/tmp/matrixcache-shards.json'))
          assert report['passed'], report
          rows = report['shards']
          # A sweep of one row compares nothing.
          assert len(rows) >= 3, rows
          by_shards = {row['shards']: row for row in rows}
          one = by_shards[1]
          best = by_shards[report['cheapest_concurrent_write_shards']]
          # Writers must be better off with shards than without. If this ever
          # reads 1, the shards are back behind one lock.
          assert best['shards'] > 1, report['cheapest_concurrent_write_shards']
          ratio = one['concurrent_write_ns'] / best['concurrent_write_ns']
          assert ratio >= 2.0, (ratio, one, best)
          # Bands, not medians: a ratio of two overlapping spreads says nothing.
          assert best['concurrent_write_high_ns'] < one['concurrent_write_low_ns'], (one, best)
          # The workload still provokes both eviction regimes.
          quiet = [r['shards'] for r in rows if r['evictions_per_write'] < 0.05]
          busy = [r['shards'] for r in rows if r['evictions_per_write'] > 0.5]
          assert quiet and busy, (quiet, busy, rows)
          # The even-workload control has to be able to hit, or its flatness
          # elsewhere in the table means nothing.
          assert min(r['hit_percent_even'] for r in rows) > 1.0, rows
          print('shard sweep ok:', ratio, 'x cheaper with', best['shards'],
                'shards; evicting at', busy, 'and not at', quiet)
          "

      - name: Backend report smoke
        run: |
          cargo run --locked --no-default-features --example rocksdb_backend_bench -- \
            --iterations 500 \
            --replacement-soak-iterations 128 \
            --json-output /tmp/matrixcache-backend-compat.json \
            --emit-operator-log \
            --require-passed
          tools/validate_backend_report.py /tmp/matrixcache-backend-compat.json \
            --expect-backend file-compat \
            --min-iterations 500 \
            --min-replacement-soak-iterations 128 \
            --min-cold-ssd-refills 1 \
            --min-memory-evictions 1 \
            --min-pmem-evictions 1 \
            --min-disk-fills 1 \
            --min-async-writeback-backpressure 1 \
            --max-refill-failures 0
          tools/emit_backend_operator_log.py /tmp/matrixcache-backend-compat.json
          tools/compare_backend_reports.py \
            /tmp/matrixcache-backend-compat.json \
            /tmp/matrixcache-backend-compat.json

      - name: Batch control report smoke
        run: |
          cargo run --locked --no-default-features --example batch_write_cost -- \
            --json-output /tmp/matrixcache-batch-control.json \
            --require-passed
          tools/validate_batch_control_report.py /tmp/matrixcache-batch-control.json \
            --min-batches 2 \
            --min-disk-hits 1 \
            --min-zero-copy-hits 1 \
            --min-refill-samples 1 \
            --min-passes 9
          tools/compare_batch_control_reports.py \
            /tmp/matrixcache-batch-control.json \
            /tmp/matrixcache-batch-control.json

      - name: Read scaling report smoke
        run: |
          cargo run --locked --no-default-features --example cache_scaling_bench -- \
            1024 \
            --json-output /tmp/matrixcache-read-scaling.json \
            --require-passed \
            --min-sharded-speedup 0.25 \
            --max-single-thread-ns 1000000
          tools/validate_read_scaling_report.py /tmp/matrixcache-read-scaling.json \
            --min-hit-costs 1 \
            --min-thread-rows 4 \
            --min-max-threads 8 \
            --min-worst-sharded-speedup 0.25 \
            --max-first-hit-ns 1000000 \
            --min-repeats 5
          tools/compare_read_scaling_reports.py \
            /tmp/matrixcache-read-scaling.json \
            /tmp/matrixcache-read-scaling.json

      - name: Read path report smoke
        run: |
          cargo run --locked --no-default-features --example read_path_cost -- \
            1024 \
            --json-output /tmp/matrixcache-read-path.json \
            --require-passed \
            --max-full-ns 1000000 \
            --max-overhead-percent 1000000 \
            --max-spread-percent 1000000
          tools/validate_read_path_report.py /tmp/matrixcache-read-path.json \
            --max-full-ns 1000000 \
            --max-overhead-percent 1000000 \
            --max-spread-percent 1000000 \
            --min-passes 7 \
            --min-entries 1024
          tools/compare_read_path_reports.py \
            /tmp/matrixcache-read-path.json \
            /tmp/matrixcache-read-path.json

      - name: Eviction report smoke
        run: |
          cargo run --locked --no-default-features --example eviction_bench -- \
            --smoke \
            --json-output /tmp/matrixcache-eviction.json \
            --require-passed \
            --max-ns-per-write 2000000 \
            --max-groups-per-eviction 128 \
            --min-hit-rate-percent 70
          tools/validate_eviction_report.py /tmp/matrixcache-eviction.json \
            --min-steady-rows 3 \
            --min-hit-rate-rows 2 \
            --min-write-pressure-writes 256 \
            --min-read-pressure-reads 20000 \
            --max-ns-per-write 2000000 \
            --max-groups-per-eviction 128 \
            --min-hit-rate-percent 70
          tools/compare_eviction_reports.py \
            /tmp/matrixcache-eviction.json \
            /tmp/matrixcache-eviction.json

      - name: Scale report smoke
        shell: bash
        run: |
          set -euo pipefail
          tools/run_scale_reports.py \
            --debug-build \
            --output-dir /tmp/matrixcache-scale-ci \
            --markdown-output /tmp/matrixcache-scale-ci/matrixcache-scale-report.md
          tools/validate_scale_report_manifest.py \
            /tmp/matrixcache-scale-ci/matrixcache-scale-report-manifest.json \
            --require-markdown
          tools/compare_scale_reports.py \
            /tmp/matrixcache-scale-ci/matrixcache-scale-report-manifest.json \
            /tmp/matrixcache-scale-ci/matrixcache-scale-report-manifest.json \
            --json-output /tmp/matrixcache-scale-ci/matrixcache-scale-comparison.json \
            --markdown-output /tmp/matrixcache-scale-ci/matrixcache-scale-comparison.md \
            --emit-operator-log
          tools/validate_scale_comparison_report.py \
            /tmp/matrixcache-scale-ci/matrixcache-scale-comparison.json \
            --min-reports 4 \
            --min-latency-fields 1 \
            --min-throughput-fields 1

      - name: Doc
        run: cargo doc --no-deps --locked

  prohibited-vocabulary:
    name: prohibited vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked files for prohibited vocabulary
        shell: bash
        run: ./scripts/check_prohibited_vocabulary.sh

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install RocksDB build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - uses: Swatinem/rust-cache@v2
      - name: Check on MSRV
        run: cargo check --all-targets --locked

  deny:
    name: cargo-deny (licenses & advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories

  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    # Informational: reports line/region coverage but does not gate merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install RocksDB build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Coverage summary
        run: cargo llvm-cov --locked --summary-only

  license-headers:
    name: license headers (SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify SPDX Apache-2.0 header on all Rust sources
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files '*.rs')
          if [ -z "$files" ]; then
            echo "No Rust sources found."; exit 0
          fi
          missing=$(grep -L 'SPDX-License-Identifier: Apache-2.0' $files || true)
          if [ -n "$missing" ]; then
            echo "The following Rust sources are missing the SPDX Apache-2.0 header:"
            echo "$missing"
            exit 1
          fi
          echo "OK: all $(echo "$files" | wc -l) Rust sources carry the SPDX Apache-2.0 header."
